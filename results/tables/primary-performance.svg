<text x="30" y="607" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">Median of accepted batch means; brackets give the prespecified bootstrap 95% interval.</text>
<text x="30" y="628" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">1 kcycle = 1000 raw hardware CPU cycles. Counter-read overhead is retained, not subtracted.</text>
<text x="30" y="649" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">Blank performance cells are correctness exclusions, never zero costs. Batch counts are retained in CSV.</text>
