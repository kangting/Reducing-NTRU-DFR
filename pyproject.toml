[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reducing-ntru-dfr"
version = "0.1.0"
description = "Paper implementations and experiments for complementary NTRU sampling"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.setuptools]
packages = ["ntru"]
package-dir = {ntru = "implementations/python/ntru"}

[tool.setuptools.package-data]
ntru = ["par.json"]
