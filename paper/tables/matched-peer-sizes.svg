<text x="30" y="283" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">API sizes come from the matched build descriptors; source sizes retain the archive convention.</text>
<text x="30" y="304" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">BAT API keys and ciphertexts include one-byte headers beyond the header-free source metadata.</text>
<text x="30" y="325" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">— means the source does not specify that length; message length does not imply shared-key length.</text>
