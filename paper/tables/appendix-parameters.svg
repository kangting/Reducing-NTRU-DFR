<text x="30" y="748" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">C/Q are supplied structural GSA/MATZOV diagnostics; b is approximate -log2(B), not a rounded strict inequality.</text>
<text x="30" y="769" font-size="12" font-weight="normal" text-anchor="start" fill="#333333">These columns are not a full KEM security claim or a NIST certificate. No compression denominator is assigned.</text>
